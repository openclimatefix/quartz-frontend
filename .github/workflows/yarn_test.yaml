name: Node CI

on: [pull_request]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x]
#        containers: [1, 2]

    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: "yarn"
    - name: install dependencies
      # Run from the repo root so the workspace yarn.lock is the one being frozen.
      run: yarn install --frozen-lockfile
    - name: typecheck
      run: |
        cd apps/nowcasting-app
        yarn typecheck
    - name: lint
      # `next lint` exits non-zero on errors only; warnings do not fail the job.
      run: |
        cd apps/nowcasting-app
        yarn lint
    - name: build app
      run: |
        cd apps/nowcasting-app
        yarn build
      env:
        SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        NODE_OPTIONS: --max_old_space_size=6144
    - name: run unit tests
      run: |
        cd apps/nowcasting-app
        yarn test --clear-cache --coverage --coverageDirectory=coverage
    - name: Run cypress tests
      # Uses the official Cypress GitHub action https://github.com/cypress-io/github-action
      uses: cypress-io/github-action@v6
      # Skip e2e for PRs from forks: secrets (Auth0 credentials, CYPRESS_RECORD_KEY) are not
      # exposed to fork PRs, so the app cannot log in and `record: true` would fail the job.
      # Same-repo PRs still run and record to Cypress Cloud. Dependabot PRs come from this
      # repo but run with Dependabot-scoped secrets, so they are skipped too.
      if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
      with:
        # Dependencies are already installed by the root `yarn install --frozen-lockfile`
        # above; the action's own install would otherwise run a second one.
        install: false
        # Starts web server for E2E tests - replace with your own server invocation
        # https://docs.cypress.io/guides/continuous-integration/introduction#Boot-your-server
        working-directory: ./apps/nowcasting-app
        start: yarn start
        # Records to Cypress Cloud
        # https://docs.cypress.io/guides/cloud/projects#Set-up-a-project-to-record
        record: true
#        parallel: true # Runs test in parallel using settings above
        config: chromeWebSecurity=false
        browser: chrome
env:
  AUTH0_AUDIENCE: ${{ secrets.AUTH0_AUDIENCE }}
  AUTH0_BASE_URL: ${{ secrets.AUTH0_BASE_URL }}
  AUTH0_CLIENT_ID: ${{ secrets.AUTH0_CLIENT_ID }}
  AUTH0_CLIENT_SECRET: ${{ secrets.AUTH0_CLIENT_SECRET }}
  AUTH0_DOMAIN: ${{ secrets.AUTH0_DOMAIN }}
  AUTH0_ISSUER_BASE_URL: ${{ secrets.AUTH0_ISSUER_BASE_URL }}
  AUTH0_SCOPE: ${{ secrets.AUTH0_SCOPE }}
  AUTH0_SECRET: ${{ secrets.AUTH0_SECRET }}
  CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
  CYPRESS_PROJECT_ID: ${{ secrets.CYPRESS_PROJECT_ID }}
  GITHUB_TOKEN: ${{ secrets.CYPRESS_GITHUB_TOKEN }}
  NEXT_PUBLIC_API_PREFIX: ${{ secrets.NEXT_PUBLIC_API_PREFIX }}
  NEXT_PUBLIC_SITES_API_PREFIX: ${{ secrets.NEXT_PUBLIC_SITES_API_PREFIX }}
  NEXT_PUBLIC_AUTH0_AUDIENCE: ${{ secrets.NEXT_PUBLIC_AUTH0_AUDIENCE }}
  NEXT_PUBLIC_AUTH0_API_AUDIENCE: ${{ secrets.NEXT_PUBLIC_AUTH0_API_AUDIENCE }}
  NEXT_PUBLIC_AUTH0_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_AUTH0_CLIENT_ID }}
  NEXT_PUBLIC_AUTH0_DOMAIN: ${{ secrets.NEXT_PUBLIC_AUTH0_DOMAIN }}
  NEXT_PUBLIC_AUTH0_PASSWORD: ${{ secrets.NEXT_PUBLIC_AUTH0_PASSWORD }}
  NEXT_PUBLIC_AUTH0_SCOPE: ${{ secrets.NEXT_PUBLIC_AUTH0_SCOPE }}
  NEXT_PUBLIC_AUTH0_USERNAME: ${{ secrets.NEXT_PUBLIC_AUTH0_USERNAME }}
  NEXT_PUBLIC_4H_VIEW: 'true'
  NEXT_PUBLIC_CI: 'true'
  SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
